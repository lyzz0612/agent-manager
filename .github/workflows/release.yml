name: release-image

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Override semantic version for this build"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: version
        shell: bash
        run: |
          current="$(tr -d '\r\n' < VERSION)"
          override="${{ github.event.inputs.version }}"
          ref_name="${GITHUB_REF##*/}"

          if [ -n "$override" ]; then
            next="$override"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            next="${ref_name#v}"
          else
            next="$(node -e "const fs=require('fs'); const [major,minor,patch]=fs.readFileSync('VERSION','utf8').trim().split('.').map(Number); console.log([major,minor,patch+1].join('.'));")"
          fi

          echo "$next" > VERSION
          echo "version=$next" >> "$GITHUB_OUTPUT"

      - name: Commit bumped VERSION back to branch
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          if git diff --quiet VERSION; then
            echo "VERSION already up to date"
            exit 0
          fi

          git add VERSION
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "chore: bump VERSION to ${{ steps.version.outputs.version }}"
          git push

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
name: release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional explicit version (X.Y.Z)"
        required: false
        type: string

permissions:
  contents: write
  packages: write

jobs:
  release:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm ci

      - name: Build web
        run: npm run build:web

      - name: Resolve version
        id: version
        shell: bash
        run: |
          CURRENT_VERSION="$(tr -d '\r\n' < VERSION)"
          EVENT_NAME="${{ github.event_name }}"
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"
          INPUT_VERSION="${{ inputs.version }}"

          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            NEXT_VERSION="${BASH_REMATCH[1]}"
          elif [[ -n "$INPUT_VERSION" ]]; then
            NEXT_VERSION="$INPUT_VERSION"
          else
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_VERSION"
            NEXT_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi

          echo "$NEXT_VERSION" > VERSION
          echo "version=$NEXT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit version update
        if: github.ref_type != 'tag'
        shell: bash
        run: |
          if git diff --quiet VERSION; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.version }}"
          git push

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image metadata
        id: image
        shell: bash
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/agent-manager"
          echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
